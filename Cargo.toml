[package]
name = "rune"
version = "0.1.0"
edition = "2024"

[dependencies]
dunce = "1.0.5"
rustyline = "18.0.1"
tokio = {version = "1.38", features = ["full"]}
reqwest = {version = "0.12", features = ["json", "stream"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
futures-util = "0.3"
similar = "2.6"
colored = "3.0"

[dev-dependencies]
tempfile = "3.10"
