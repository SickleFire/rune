[package]
name = "rune-code"
version = "0.4.0"
edition = "2024"
description = "An expert AI coding assistant integrated into software development workspaces, CLI, and game engines (Unity/Godot)"
license = "MIT"
repository = "https://github.com/SickleFire/rune"
documentation = "https://github.com/SickleFire/rune#readme"
readme = "README.md"
keywords = ["ai", "assistant", "cli", "repl", "game-development"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["clock"] }
dunce = "1.0.5"
rustyline = "18.0.1"
tokio = {version = "1.38", features = ["full"]}
reqwest = {version = "0.12", features = ["json", "stream"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
futures-util = "0.3"
similar = "2.6"
colored = "3.0"
urlencoding = "2.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "mysql", "macros"] }
config = "0.14"

[dev-dependencies]
tempfile = "3.10"
